# Deploys the static app to GitHub Pages (https://<user>.github.io/hunt-map/).
# Parcel data is never part of the site: each phone fetches it from the AR GIS Office.
# Boundary + MVUM parts are committed; workflow merges parts / falls back to fetch.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Vendor Leaflet 1.9.4 (pinned)
        run: |
          npm pack leaflet@1.9.4 --silent
          tar xzf leaflet-1.9.4.tgz
          cp package/dist/leaflet.js package/dist/leaflet.css vendor/leaflet/
          cd vendor/leaflet
          echo "db49d009c841f5ca34a888c96511ae936fd9f5533e90d8b2c4d57596f4e5641a  leaflet.js" | sha256sum -c -
          echo "a7837102824184820dfa198d1ebcd109ff6d0ff9a2672a074b9a1b4d147d04c6  leaflet.css" | sha256sum -c -
      - name: Python deps
        run: python3 -m pip install --quiet pillow shapely
      - name: Ensure WMA boundary (committed, else fetch)
        run: |
          if [ -f data/wma-boundary.geojson ]; then echo "using committed wma-boundary.geojson"; else python3 scripts/fetch-boundary.py; fi
      - name: Ensure USFS MVUM roads (committed parts, else fetch)
        run: |
          if ls data/mvum-*.geojson >/dev/null 2>&1; then
            python3 -c "import json,glob;ps=sorted(glob.glob('data/mvum-*.geojson'));feats=[];[feats.extend(json.load(open(p))['features']) for p in ps];json.dump({'type':'FeatureCollection','features':feats},open('data/mvum.geojson','w'),separators=(',',':'));print('merged',len(feats),'from',len(ps),'parts')"
          elif [ -f data/mvum.geojson ]; then
            echo "using committed mvum.geojson"
          else
            python3 scripts/fetch-mvum.py || echo "::warning::MVUM fetch failed; site deploys without the roads layer"
          fi
      - name: Generate PNG icons
        run: python3 scripts/make-icons.py
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js .nojekyll css js vendor icons data _site/
          rm -f _site/data/parcels*.geojson
          if find _site/data -iname '*parcel*' | grep -q .; then echo "parcel file found"; exit 1; fi
          if ls _site/data/*.geojson >/dev/null 2>&1 && grep -qi "ownername" _site/data/*.geojson; then echo "owner-name data found"; exit 1; fi
          find _site -type f | sort
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
